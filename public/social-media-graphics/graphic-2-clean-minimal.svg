  <rect x="230" y="900" width="400" height="80" rx="16" fill="url(#orangeGrad2)"/>
  <text x="430" y="949" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">Get Started Today →</text>

  <text x="660" y="949" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="start">biddaro.com</text>
