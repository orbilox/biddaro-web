<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad1)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="150" r="280" fill="#f97316" opacity="0.06"/>
  <circle cx="900" cy="150" r="200" fill="#f97316" opacity="0.08"/>
  <circle cx="150" cy="900" r="220" fill="#f97316" opacity="0.05"/>

  <!-- Top accent line -->
  <rect x="80" y="80" width="120" height="6" rx="3" fill="url(#orangeGrad1)"/>

  <!-- Logo area -->
  <rect x="80" y="110" width="56" height="56" rx="12" fill="#f97316"/>
  <text x="108" y="148" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">B</text>
  <text x="150" y="148" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">BIDDARO</text>

  <!-- Main headline -->
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="90" font-weight="900" fill="white" letter-spacing="-2">GROW YOUR</text>
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="90" font-weight="900" fill="white" letter-spacing="-2">BUSINESS</text>
  <text x="80" y="520" font-family="Arial, sans-serif" font-size="90" font-weight="900" fill="url(#orangeGrad1)" letter-spacing="-2">FASTER.</text>

  <!-- Rate badge -->
  <rect x="80" y="570" width="480" height="150" rx="20" fill="#f97316"/>
  <text x="560" y="638" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="white" text-anchor="middle">9%</text>
  <text x="560" y="690" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="white" text-anchor="middle" opacity="0.9">INTEREST RATE P.A.</text>

  <!-- Subtext -->
  <text x="80" y="780" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" font-weight="400">Business loans designed for</text>
  <text x="80" y="825" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" font-weight="400">entrepreneurs like you.</text>

  <!-- CTA Button -->
  <rect x="80" y="870" width="340" height="72" rx="36" fill="url(#orangeGrad1)"/>
  <text x="250" y="914" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">Apply Now →</text>

  <!-- Bottom bar -->
  <rect x="0" y="1040" width="1080" height="40" fill="#f97316" opacity="0.15"/>
  <text x="540" y="1065" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">www.biddaro.com | Business Loans</text>
</svg>
