  <text x="115" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white" opacity="0.9">BIDDARO</text>
  <text x="115" y="85" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">Business Finance</text>

