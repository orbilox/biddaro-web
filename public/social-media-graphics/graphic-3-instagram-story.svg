<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="storyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeCircle" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storyOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#storyBg)"/>

  <!-- Radial glow center -->
  <ellipse cx="540" cy="960" rx="600" ry="600" fill="url(#radGlow)"/>

  <!-- Top decorative dots pattern -->
  <circle cx="100" cy="100" r="6" fill="#f97316" opacity="0.4"/>
  <circle cx="160" cy="100" r="6" fill="#f97316" opacity="0.3"/>
  <circle cx="220" cy="100" r="6" fill="#f97316" opacity="0.2"/>
  <circle cx="100" cy="160" r="6" fill="#f97316" opacity="0.3"/>
  <circle cx="160" cy="160" r="6" fill="#f97316" opacity="0.2"/>
  <circle cx="980" cy="100" r="6" fill="#f97316" opacity="0.4"/>
  <circle cx="920" cy="100" r="6" fill="#f97316" opacity="0.3"/>
  <circle cx="860" cy="100" r="6" fill="#f97316" opacity="0.2"/>
  <circle cx="980" cy="160" r="6" fill="#f97316" opacity="0.3"/>
  <circle cx="920" cy="160" r="6" fill="#f97316" opacity="0.2"/>

  <!-- Logo -->
  <rect x="40" y="60" width="70" height="70" rx="16" fill="#f97316"/>
  <text x="75" y="107" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="white" text-anchor="middle">B</text>
  <text x="125" y="97" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">BIDDARO</text>

  <!-- Top section text -->
  <text x="540" y="340" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">SPECIAL OFFER</text>

  <!-- Main circular badge -->
  <circle cx="540" cy="620" r="320" fill="#f97316" opacity="0.1"/>
  <circle cx="540" cy="620" r="280" fill="#f97316" opacity="0.12"/>
  <circle cx="540" cy="620" r="240" fill="#1e293b"/>
  <circle cx="540" cy="620" r="238" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="20,10"/>

  <!-- Rate inside circle -->
  <text x="540" y="560" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#94a3b8" text-anchor="middle">Interest Rate</text>
  <text x="540" y="670" font-family="Arial, sans-serif" font-size="160" font-weight="900" fill="#f97316" text-anchor="middle">9%</text>
  <text x="540" y="720" font-family="Arial, sans-serif" font-size="30" fill="#94a3b8" text-anchor="middle">Per Annum</text>

  <!-- Middle headline -->
  <text x="540" y="1020" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="white" text-anchor="middle">FUEL YOUR</text>
  <text x="540" y="1095" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="white" text-anchor="middle">BUSINESS</text>
  <text x="540" y="1170" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#f97316" text-anchor="middle">DREAMS!</text>

  <!-- Divider -->
  <line x1="200" y1="1220" x2="880" y2="1220" stroke="#334155" stroke-width="1.5"/>

  <!-- Benefits strip -->
  <rect x="60" y="1250" width="960" height="250" rx="24" fill="#1e293b"/>

  <!-- Benefit 1 -->
  <text x="200" y="1340" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#f97316" text-anchor="middle">24h</text>
  <text x="200" y="1380" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Approval</text>
  <text x="200" y="1408" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Time</text>

  <!-- Divider -->
  <line x1="370" y1="1265" x2="370" y2="1495" stroke="#334155" stroke-width="1"/>

  <!-- Benefit 2 -->
  <text x="540" y="1340" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#f97316" text-anchor="middle">₹50L</text>
  <text x="540" y="1380" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Max Loan</text>
  <text x="540" y="1408" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Amount</text>

  <!-- Divider -->
  <line x1="710" y1="1265" x2="710" y2="1495" stroke="#334155" stroke-width="1"/>

  <!-- Benefit 3 -->
  <text x="880" y="1340" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#f97316" text-anchor="middle">5yr</text>
  <text x="880" y="1380" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Flexible</text>
  <text x="880" y="1408" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Tenure</text>

  <!-- CTA Button -->
  <rect x="140" y="1560" width="800" height="100" rx="50" fill="#f97316"/>
  <text x="540" y="1621" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="white" text-anchor="middle">Apply for Business Loan</text>

  <!-- Swipe up text -->
  <text x="540" y="1730" font-family="Arial, sans-serif" font-size="28" fill="#64748b" text-anchor="middle">Swipe Up to Apply</text>
  <text x="540" y="1760" font-family="Arial, sans-serif" font-size="40" fill="#64748b" text-anchor="middle">↑</text>

  <!-- Bottom domain -->
  <text x="540" y="1860" font-family="Arial, sans-serif" font-size="26" fill="#475569" text-anchor="middle">www.biddaro.com</text>
</svg>
